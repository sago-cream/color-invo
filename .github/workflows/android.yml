name: Android checks

on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/android/**", "scripts/android-*", "scripts/AndroidSigningCheck.java", "scripts/tests/**", ".github/workflows/android*.yml"]
  push:
    branches: [main, feat/android-native]
    paths: ["apps/android/**", "scripts/android-*", "scripts/AndroidSigningCheck.java", "scripts/tests/**", ".github/workflows/android*.yml"]

permissions:
  contents: read
concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/android-verify.yml
