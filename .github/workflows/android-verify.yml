name: Android verification

on:
  workflow_call:
    inputs:
      version_name:
        type: string
        default: "0.1.0"
      version_code:
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/android
      - name: Verify release tooling without credentials
        working-directory: apps/android
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          bundle exec ruby fastlane/release_config_test.rb
          bundle exec fastlane lanes
      - uses: actions/cache@v4
        with:
          path: apps/android/.tools
          key: bundletool-1.18.3-a099cfa1543f
      - name: Build and verify release candidate
        run: scripts/android-candidate.sh
      - name: Save installable debug APK and unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: android-candidate-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/bundle/release/release-manifest.json
            apps/android/app/build/outputs/mapping/release/mapping.txt
      - name: Save build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: apps/android/app/build/reports/

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: cd apps/android && ./gradlew connectedDebugAndroidTest
      - name: Save device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports-api-${{ matrix.api }}
          path: |
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/outputs/androidTest-results/
