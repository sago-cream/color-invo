name: Android Play release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Candidate needs no secrets; bundle needs signing; upload/promote need Play access
        required: true
        default: candidate
        type: choice
        options: [candidate, bundle, upload, promote]
      version_name:
        description: Version name (ignored for promotion)
        required: true
        default: "0.1.0"
        type: string
      version_code:
        description: New upload version code, or exact existing version to promote
        required: true
        type: string
      track:
        description: Upload or promotion destination
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      source_track:
        description: Existing track when promoting
        default: internal
        type: choice
        options: [internal, alpha, beta]
      release_status:
        description: Keep draft until Console setup is complete; completed makes the release available after review
        default: draft
        type: choice
        options: [draft, completed]
      validate_only:
        description: Validate upload/promotion with Google without committing the edit
        default: true
        type: boolean

permissions:
  contents: read
concurrency:
  group: android-play-release
  cancel-in-progress: false

env:
  ANDROID_VERSION_NAME: ${{ inputs.version_name }}
  ANDROID_VERSION_CODE: ${{ inputs.version_code }}
  PLAY_TRACK: ${{ inputs.track }}
  PLAY_SOURCE_TRACK: ${{ inputs.source_track }}
  PLAY_RELEASE_STATUS: ${{ inputs.release_status }}
  PLAY_VALIDATE_ONLY: ${{ inputs.validate_only }}
  FASTLANE_SKIP_UPDATE_CHECK: "1"

jobs:
  verify:
    if: inputs.operation != 'promote'
    uses: ./.github/workflows/android-verify.yml
    with:
      version_name: ${{ inputs.version_name }}
      version_code: ${{ inputs.version_code }}

  signed-bundle:
    if: inputs.operation == 'bundle' || inputs.operation == 'upload'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play
    env:
      ANDROID_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/apps/android/colorinvo-upload.jks
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ github.workspace }}/apps/android/play-service-account.json
      ANDROID_AAB_PATH: ${{ github.workspace }}/apps/android/app/build/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare and verify credentials before building
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          value = os.environ.get('KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Missing ANDROID_UPLOAD_KEYSTORE_BASE64 in the google-play environment.')
          path = pathlib.Path(os.environ['ANDROID_UPLOAD_KEYSTORE_PATH'])
          path.write_bytes(base64.b64decode(''.join(value.split()), validate=True))
          path.chmod(0o600)
          if os.environ['RELEASE_OPERATION'] == 'upload':
              path = pathlib.Path(os.environ['PLAY_SERVICE_ACCOUNT_JSON'])
              path.write_text(os.environ['PLAY_JSON'])
              path.chmod(0o600)
          PY
          java scripts/AndroidSigningCheck.java signing apps/android
          if [[ "$RELEASE_OPERATION" == upload ]]; then
            python3 scripts/android-play-credentials.py
          fi
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/cache@v4
        with:
          path: apps/android/.tools
          key: bundletool-1.18.3-a099cfa1543f
      - name: Build and verify signed AAB
        run: scripts/android-bundle.sh
      - name: Save signed release before attempting any Play API call
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-${{ inputs.version_code }}-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/bundle/release/release-manifest.json
            apps/android/app/build/outputs/mapping/release/mapping.txt
            apps/android/play/
      - uses: ruby/setup-ruby@v1
        if: inputs.operation == 'upload'
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/android
      - name: Validate or upload to Play
        if: inputs.operation == 'upload'
        run: scripts/android-upload.sh
      - name: Remove private credentials
        if: always()
        run: rm -f "$ANDROID_UPLOAD_KEYSTORE_PATH" "$PLAY_SERVICE_ACCOUNT_JSON"

  promote:
    if: inputs.operation == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: google-play
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ github.workspace }}/apps/android/play-service-account.json
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/android
      - name: Prepare Play credentials
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path(os.environ['PLAY_SERVICE_ACCOUNT_JSON'])
          path.write_text(os.environ['PLAY_JSON'])
          path.chmod(0o600)
          PY
          python3 scripts/android-play-credentials.py
      - name: Validate or promote the existing version
        run: bundle exec fastlane android promote
        working-directory: apps/android
      - name: Remove private credentials
        if: always()
        run: rm -f "$PLAY_SERVICE_ACCOUNT_JSON"
